[package]
name = "nova-setup"
version = "0.1.5"
edition = "2021"
description = "Nova for Houdini: the installer"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
winreg = "0.55"
rfd = "0.15"
dirs = "6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
] }

[features]
# The frontend is embedded in the executable (no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
