<!-- Nova's icon in Houdini: the O of the Nova logo. The outer contour and the
     counter are the logo's, each fitted with four cubic arcs (semi-axes 195.4 x 210
     and 95.4 x 124 logo pixels, handle factors 0.600 and 0.630); ink #0a0a0a, the
     counter #f9f7f3, the dot #fe4819 with the logo's glow. Transparent around the O;
     a faint off-white rim keeps its edge on dark backgrounds. Houdini finds it by
     name (NOVA_logo) in config/Icons on HOUDINI_PATH. -->
