# The renderer core without Houdini (NOVA_CORE_ONLY, cmake/NovaStandalone.cmake):
# nova_core and its Catch2 unit tests on Linux, built with GCC against system
# libraries. The Hydra delegate, the Houdini package, nova_cli and the GPU
# backend need Houdini on Windows and are not built here.
name: core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, GCC (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [core, core-sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: Install Embree, oneTBB, OpenSubdiv and Catch2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libembree-dev libtbb-dev libosd-dev catch2
      # The NanoVDB 32.6 headers are fetched by the configure step.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
