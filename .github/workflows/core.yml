# The renderer core without Houdini (NOVA_CORE_ONLY, cmake/NovaStandalone.cmake):
# nova_core and its Catch2 unit tests on Linux, built with GCC against system
# libraries. The Hydra delegate, the Houdini package, nova_cli and the GPU
# backend need Houdini on Windows and are not built here.
#
# A step that fails puts the lines that say why into annotations (::error::),
# which the checks API returns without a login: the log itself needs one.
name: core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, GCC (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [core, core-sanitize]
    steps:
      - uses: actions/checkout@v4
      # The runner's package sources fail at times: on 2026-11-11 the indexes of
      # noble-updates, noble-backports and noble-security could not be fetched
      # from any of the runner's three mirrors for hours, and every run ended
      # here. Three attempts with short timeouts: the runner's setup, then
      # Ubuntu's own archive in place of the runner's mirror of it, then another
      # mirror of the archive. What apt says went wrong goes into annotations.
      - name: Install Embree, oneTBB, OpenSubdiv and Catch2
        shell: bash
        run: |
          packages="ninja-build libembree-dev libtbb-dev libosd-dev catch2"
          quick="-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          lists="/etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources"
          # apt's E: lines, and the reason it prints under an Err: line.
          report() {
            { grep -E '^E:' apt.log | sort -u | head -n 3
              grep -A1 -E '^Err:' apt.log | grep -E '^ +[^ ]' | sort -u | head -n 2; } |
              while IFS= read -r line; do echo "::warning title=apt-get attempt $1::$line"; done || true
          }
          # update with the given options (an index that cannot be fetched fails it), then install.
          attempt() {
            sudo apt-get $quick -o APT::Update::Error-Mode=any $1 update 2>&1 | tee apt.log &&
              sudo apt-get $quick install -y --no-install-recommends $packages 2>&1 | tee -a apt.log
          }
          if attempt ""; then exit 0; fi
          report 1
          for list in $lists; do
            if [ -f "$list" ]; then sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$list"; fi
          done
          if attempt ""; then echo "::notice title=apt-get::installed from archive.ubuntu.com (attempt 2)"; exit 0; fi
          report 2
          # Another mirror, and an index past its Valid-Until date is accepted
          # there: a mirror that lags is better than no build, and the packages
          # are verified by the archive's signatures all the same.
          for list in $lists; do
            if [ -f "$list" ]; then
              sudo sed -i -E 's#https?://(azure\.archive|archive|security)\.ubuntu\.com/ubuntu#https://mirrors.edge.kernel.org/ubuntu#g' "$list"
            fi
          done
          if attempt "-o Acquire::Check-Valid-Until=false"; then
            echo "::notice title=apt-get::installed from mirrors.edge.kernel.org (attempt 3)"
            exit 0
          fi
          report 3
          echo "::error title=apt-get::the packages could not be installed in three attempts"
          exit 1
      # The NanoVDB 32.6 headers are fetched by the configure step.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        shell: bash
        run: |
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log || {
            grep -E ': (fatal )?error:|undefined reference|^FAILED:' build.log | head -n 10 | while IFS= read -r line; do
              echo "::error title=build::$line"
            done || true
            exit 1
          }
      - name: Test
        shell: bash
        run: |
          ctest --preset ${{ matrix.preset }} 2>&1 | tee ctest.log || {
            grep -E '\((Failed|Timeout|SEGFAULT|Subprocess aborted|Not Run)\)$|tests failed out of|SUMMARY: [A-Za-z]*Sanitizer|runtime error:' ctest.log |
              sort -u | head -n 10 | while IFS= read -r line; do
              echo "::error title=ctest::$line"
            done || true
            exit 1
          }
